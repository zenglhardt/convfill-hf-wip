[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "convfill"
version = "0.1.0"
description = "ConvFill: Dual model collaboration system pairing a lightweight Talker model with a cloud Reasoner model"
requires-python = ">=3.11,<3.13"
dependencies = [
    # Keep the Python server on the same upstream revision as the vendored
    # browser client in web_demo/hf_interface/UPSTREAM.md.
    "speech-to-speech @ git+https://github.com/huggingface/speech-to-speech.git@b21e54d6a845c54308bc62500b57f9a2b2aa93ac",
    "anthropic==0.100.0",
    "strip-markdown==1.3",
    "jinja2",
    "nltk",
]

[project.optional-dependencies]
rag = ["faiss-cpu", "sentence-transformers"]
mcp = ["mcp"]
gemini = ["google-generativeai"]
dev = ["pytest==9.0.2", "httpx"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "web_demo*"]
exclude = ["web_demo.frontend*", "web_demo.hf_interface.node_modules*"]

[tool.pytest.ini_options]
testpaths = ["web_demo/hf_convfill", "web_demo/hf_interface"]
